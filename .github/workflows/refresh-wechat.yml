name: 刷新公众号链接

# 与“爬取教师招聘信息”错开 30 分钟：
#   主爬虫  : 0 */2  (UTC 0:00/2:00...)  → 北京时间 8:00/10:00...
#   本工作流: 30 */2 (UTC 0:30/2:30...)  → 北京时间 8:30/10:30...
# 职责：仅维护 jobs.json 中已有公众号条目的链接新鲜度（临时链接→永久链接），
#       不再做全量关键词搜索，更轻、反爬压力更小。
on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:  # 允许手动触发

# 与爬虫不同组，但同样需要 contents: write 用于 commit & push
concurrency:
  group: refresh-wechat
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: 检出代码
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        cd crawler
        pip install -r requirements.txt
        python -m playwright install chromium

    - name: 刷新公众号链接
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # 先同步到远端最新 main，尽量在最新数据基础上刷新，减少后续推送竞态
        git fetch origin main
        git rebase origin/main || git rebase --abort
        cd crawler
        python refresh_wechat_links.py

    - name: 提交并推送链接更新
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add data/jobs.json
        if git diff --cached --quiet; then
          echo "没有链接变更，跳过提交。"
          exit 0
        fi

        git commit -m "刷新公众号链接 - $(date +'%Y-%m-%d %H:%M:%S')"

        # 带重试的 rebase + push，兜底处理与主爬虫并发修改 data/jobs.json 的竞态。
        # 关键点：两个工作流都会改 data/jobs.json，git 的行级自动合并经常产生
        # CONFLICT。这里不手工解冲突，而是「以远端 main 为准 + 在其上重新刷新」：
        # 这样既拿到主爬虫的新条目，又由本工作流重新求出正确的永久链接。
        for i in 1 2 3 4 5; do
          if git pull --rebase origin main; then
            # rebase 成功（自动合并已处理 jobs.json），直接尝试推送
            if git push origin main; then
              echo "推送成功。"
              exit 0
            fi
          else
            # rebase 冲突：以远端 main 为准，重新在其上刷新链接并改写本次提交
            echo "检测到 jobs.json 冲突，采用「以远端为准 + 重新刷新」策略解决..."
            git checkout --theirs -- data/jobs.json 2>/dev/null || true
            git add data/jobs.json
            GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --abort
            python crawler/refresh_wechat_links.py
            git add data/jobs.json
            git commit --amend -m "刷新公众号链接 - $(date +'%Y-%m-%d %H:%M:%S')" 2>/dev/null \
              || git commit -m "刷新公众号链接(冲突重刷) - $(date +'%Y-%m-%d %H:%M:%S')"
            if git push origin main; then
              echo "推送成功。"
              exit 0
            fi
          fi
          echo "第 $i 次推送失败，3 秒后重试..."
          git rebase --abort 2>/dev/null || true
          sleep 3
        done
        echo "重试 5 次后仍失败。" >&2
        exit 1
