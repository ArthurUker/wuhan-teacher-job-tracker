name: 爬取教师招聘信息

on:
  schedule:
    # 每12小时运行一次（节省 Actions 额度）
    # 公众号临时链接新鲜度由「刷新公众号链接」工作流兜底维护
    # (UTC 0:00, 12:00)
    # 对应北京时间: 8:00, 20:00
    - cron: '0 */12 * * *'
  workflow_dispatch:  # 允许手动触发

# 同一时刻只允许一个爬虫工作流运行，避免并发互推导致 push 被拒绝
concurrency:
  group: crawler-main
  cancel-in-progress: false

# 只需要 contents: write 权限（用于 commit & push）
# GitHub Pages 直接从 main 分支提供静态文件，不需要 pages/write 权限
permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
    - name: 检出代码
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        cd crawler
        pip install -r requirements.txt
        python -m playwright install chromium

    - name: 运行爬虫
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # 先同步到远端最新 main，尽量在最新数据（含刷新工作流已更新的链接）基础上爬取，
        # 减少后续推送时的并发冲突
        git fetch origin main
        git rebase origin/main || git rebase --abort
        cd crawler
        python main.py

    - name: 提交并推送数据更新
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add data/jobs.json
        if git diff --cached --quiet; then
          echo "没有数据变更，跳过提交。"
          exit 0
        fi

        git commit -m "自动更新招聘数据 - $(date +'%Y-%m-%d %H:%M:%S')"

        # 带重试的 rebase + push。两个工作流都会改 data/jobs.json，并发时行级合并会
        # 产生 CONFLICT。这里不手工解冲突，而是「以远端 main 为准 + 在其上重新爬取合并」：
        # 既保留刷新工作流更新的链接，又把本次新抓到的条目合并进去，从根上避免冲突。
        for i in 1 2 3 4 5; do
          if git pull --rebase origin main; then
            if git push origin main; then
              echo "推送成功。"
              exit 0
            fi
          else
            # rebase 冲突：以远端 main 为准，重新在其上爬取并改写本次提交
            echo "检测到 data/jobs.json 冲突，采用「以远端为准 + 重新爬取合并」策略解决..."
            git checkout --theirs -- data/jobs.json 2>/dev/null || true
            git add data/jobs.json
            GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --abort
            cd crawler
            python main.py
            cd ..
            git add data/jobs.json
            git commit --amend -m "自动更新招聘数据 - $(date +'%Y-%m-%d %H:%M:%S')" 2>/dev/null \
              || git commit -m "自动更新招聘数据(冲突重爬) - $(date +'%Y-%m-%d %H:%M:%S')"
            if git push origin main; then
              echo "推送成功。"
              exit 0
            fi
          fi
          echo "第 $i 次推送失败，3 秒后重试..."
          git rebase --abort 2>/dev/null || true
          sleep 3
        done
        echo "重试 5 次后仍失败。" >&2
        exit 1
