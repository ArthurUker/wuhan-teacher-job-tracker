name: 爬取教师招聘信息

on:
  schedule:
    # 每2小时运行一次，自动刷新搜狗微信临时链接
    # 搜狗临时链接预计 2-6 小时失效，2小时重爬确保安全
    # (UTC 0:00, 2:00, 4:00 ... 22:00)
    # 对应北京时间: 8:00, 10:00, 12:00 ... 次日 6:00
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 允许手动触发

# 同一时刻只允许一个爬虫工作流运行，避免并发互推导致 push 被拒绝
concurrency:
  group: crawler-main
  cancel-in-progress: false

# 只需要 contents: write 权限（用于 commit & push）
# GitHub Pages 直接从 main 分支提供静态文件，不需要 pages/write 权限
permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        cd crawler
        pip install -r requirements.txt
        python -m playwright install chromium

    - name: 运行爬虫
      run: |
        cd crawler
        python main.py

    - name: 提交并推送数据更新
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # 先检查是否有实际变更；无变更则直接跳过，避免后续 stash pop 因无 stash entry 而失败
        git add data/jobs.json
        if git diff --cached --quiet; then
          echo "没有数据变更，跳过提交。"
          exit 0
        fi

        # 暂存爬虫生成的新数据，避免 rebase 时因未暂存更改而失败
        git stash push -m "临时暂存爬虫数据"

        # 拉取远端最新代码并 rebase
        git fetch origin main
        git rebase origin/main

        # 恢复暂存的爬虫数据
        git stash pop

        # 重新 add 变更文件，准备提交
        git add data/jobs.json

        git commit -m "自动更新招聘数据 - $(date +'%Y-%m-%d %H:%M:%S')"

        # 带重试的 rebase + push，兜底处理极端竞态（如外部推送）
        for i in 1 2 3 4 5; do
          if git pull --rebase origin main && git push origin main; then
            echo "推送成功。"
            exit 0
          fi
          echo "第 $i 次推送失败，可能是远端有新提交，3 秒后重试..."
          git rebase --abort 2>/dev/null || true
          sleep 3
        done
        echo "重试 5 次后仍失败。" >&2
        exit 1
