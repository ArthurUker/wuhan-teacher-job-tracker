name: 爬取教师招聘信息

on:
  schedule:
    # 每天北京时间8点运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

# 同一时刻只允许一个爬虫工作流运行，避免并发互推导致 push 被拒绝
concurrency:
  group: crawler-main
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        cd crawler
        pip install -r requirements.txt
        python -m playwright install chromium

    - name: 运行爬虫
      run: |
        cd crawler
        python main.py

    - name: 提交更新
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # 暂存爬虫生成的新数据，避免 rebase 时因未暂存更改而失败
        git add data/jobs.json
        git stash push -m "临时暂存爬虫数据"

        # 拉取远端最新代码并 rebase
        git fetch origin main
        git rebase origin/main

        # 恢复暂存的爬虫数据
        git stash pop

        # 重新 add 变更文件，准备提交
        git add data/jobs.json
        # 没有变更则跳过提交与推送
        if git diff --cached --quiet; then
          echo "没有数据变更，跳过提交。"
          exit 0
        fi

        git commit -m "自动更新招聘数据 - $(date +'%Y-%m-%d %H:%M:%S')"

        # 带重试的 rebase + push，兜底处理极端竞态（如外部推送）
        for i in 1 2 3 4 5; do
          if git pull --rebase origin main && git push origin main; then
            echo "推送成功。"
            exit 0
          fi
          echo "第 $i 次推送失败，可能是远端有新提交，3 秒后重试..."
          git rebase --abort 2>/dev/null || true
          sleep 3
        done
        echo "重试 5 次后仍失败。" >&2
        exit 1

  # 爬虫运行成功后，重新部署 GitHub Pages
  deploy-pages:
    needs: crawl
    if: always() && needs.crawl.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v5

    - name: 设置 Pages
      uses: actions/configure-pages@v5

    - name: 上传构建产物
      uses: actions/upload-pages-artifact@v5
      with:
        path: '.'

    - name: 部署到 GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
