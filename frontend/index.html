<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武汉教师招聘信息追踪系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 武汉教师招聘信息追踪系统</h1>
            <p class="subtitle">实时监控武汉市及湖北省教师招聘信息</p>
        </header>

        <div class="controls">
            <button onclick="loadJobs()">🔄 刷新数据</button>
        </div>

        <!-- 来源筛选卡片 -->
        <div class="source-cards" id="sourceCards">
            <!-- JS 动态生成 -->
        </div>

        <!-- 额外筛选选项 -->
        <div class="extra-filters">
            <label class="toggle-label">
                <input type="checkbox" id="excludeUniversity" onchange="filterJobs()">
                <span class="toggle-switch"></span>
                <span class="toggle-text">排除高校招聘</span>
            </label>
        </div>

        <div class="stats">
            <span id="totalCount">共 0 条信息</span>
            <span id="lastUpdate">最后更新: --</span>
        </div>

        <div id="jobList" class="job-list">
            <p class="loading">正在加载数据...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
