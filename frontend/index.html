<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武汉教师招聘信息追踪系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 武汉教师招聘信息追踪系统</h1>
            <p class="subtitle">实时监控武汉市及湖北省教师招聘信息</p>
        </header>

        <div class="controls">
            <button onclick="loadJobs()">🔄 刷新数据</button>
            <button onclick="requestTriggerCrawl()" id="crawlBtn">🚀 重新抓取</button>
        </div>

        <!-- 来源筛选卡片 -->
        <div class="source-cards" id="sourceCards">
            <!-- JS 动态生成 -->
        </div>

        <!-- 额外筛选选项已移除：排除高校招聘现为默认行为 -->

        <div class="stats">
            <span id="totalCount">共 0 条信息</span>
            <span id="lastUpdate">最后更新: --</span>
        </div>

        <!-- 分页与视图控制 -->
        <div class="pagination-controls">
            <div class="per-page-selector">
                <label>每页显示：</label>
                <select id="perPage" onchange="changePerPage()">
                    <option value="10">10 条</option>
                    <option value="20" selected>20 条</option>
                    <option value="50">50 条</option>
                    <option value="100">100 条</option>
                </select>
            </div>
            <div class="view-toggle">
                <button id="cardViewBtn" class="view-btn active" onclick="switchView('card')">☷ 卡片</button>
                <button id="listViewBtn" class="view-btn" onclick="switchView('list')">☰ 列表</button>
            </div>
        </div>

        <div id="jobList" class="job-list">
            <p class="loading">正在加载数据...</p>
        </div>

        <!-- 分页导航 -->
        <div class="pagination-nav" id="paginationNav"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
